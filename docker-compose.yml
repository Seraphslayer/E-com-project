# Runs the whole site on one server: MongoDB + API + web (Caddy: storefront, admin, HTTPS).
#   cp .env.example .env   (fill it in: domains, JWT_SECRET, admin login, Maya keys)
#   docker compose up -d --build
#   docker compose exec api node dist/seed/run.js      # optional: load the demo catalog
# Full steps: DEPLOYMENT.md
#
# Using MongoDB Atlas instead of the bundled database? Set MONGODB_URI in .env; the local
# "mongo" service is then simply unused (you can remove it and the depends_on entry).

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/fgt}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ characters)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SITE_URL: ${SITE_URL:-}
      MAYA_PUBLIC_KEY: ${MAYA_PUBLIC_KEY:-}
      MAYA_SECRET_KEY: ${MAYA_SECRET_KEY:-}
      MAYA_API_URL: ${MAYA_API_URL:-https://pg-sandbox.paymaya.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - uploads:/data/uploads

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_STORE_URL: ${VITE_STORE_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      STORE_DOMAIN: ${STORE_DOMAIN:-http://localhost}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-http://admin.localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data   # keeps the HTTPS certificates between restarts

volumes:
  mongo-data:
  uploads:
  caddy-data:
