# Runs the whole site: MongoDB + API + web (nginx).
#   cp .env.example .env   (fill in JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD)
#   docker compose up -d --build
#   docker compose exec api node dist/seed/run.js      # optional: load the demo catalog
# Site: http://localhost  (set WEB_PORT in .env to change)
#
# Using MongoDB Atlas / your own MongoDB instead? Set MONGODB_URI in .env; the local
# "mongo" service is then simply unused (you can remove it and the depends_on entry).

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/fgt}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ characters)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - uploads:/data/uploads

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  mongo-data:
  uploads:
